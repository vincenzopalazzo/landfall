[package]
name = "landfall-httpd"
description = "OCEAN Lightning payout — local loopback HTTP server for web/desktop frontends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "landfall-httpd"
path = "src/main.rs"

[features]
# QA-only: compiles the `--mock-wallet` flag, which swaps the Lexe-backed
# provider for an in-memory stub so the whole HTTP + web-wizard flow can be
# driven headlessly without a Lexe node (scripts/qa/*). Never enabled in the
# release build, so the production binary has no such flag.
qa-mock = []

[dependencies]
# Default features on → in-process Lexe wallet (`/offer`, `/init`) available.
landfall-common = { path = "../landfall-common" }
axum.workspace = true
tower-http.workspace = true
tokio = { workspace = true, features = ["net"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
zeroize.workspace = true
# MCP no longer lives in this process — `landfall-mcp` is a separate
# runnable binary that reaches these REST endpoints via HTTP.
# See `docs/plans/2026-06-07-pr-e-mcp-proxy.md`.

[dev-dependencies]
# Bound-socket integration tests drive the server over real HTTP.
reqwest.workspace = true
serde_json.workspace = true
