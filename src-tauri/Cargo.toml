[package]
name = "oceanln-desktop"
version = "0.3.0"
description = "OCEAN Lightning — Tauri desktop shell for the onboarding wizard"
authors = ["Vincenzo Palazzo"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/vincenzopalazzo/oceanln-cli"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "oceanln_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# Opens external explorer links (ocean.xyz / mempool.space) in the OS default
# browser — the webview can't follow them itself. Cross-platform: `open` on
# macOS, `xdg-open` on Linux, `start` on Windows.
open = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The shared backend: the desktop commands call straight into the service layer,
# so they share the exact signing/seed logic the HTTP transport uses. `lexe-sdk`
# rides in via oceanln-httpd's default features (real offer/init).
oceanln-common = { path = "../oceanln-common" }
oceanln-httpd = { path = "../oceanln-httpd" }

# Own workspace + own Cargo.lock: Tauri pulls a large native dependency tree, so
# this crate is detached from the root workspace (which also `exclude`s it). The
# root `cargo --workspace` CI jobs therefore never build it; the desktop app gets
# its own job when we wire installers.
[workspace]
