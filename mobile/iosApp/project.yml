name: iosApp
options:
  bundleIdPrefix: xyz.ocean
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # UniFFI-generated Swift glue for the Rust core (../core/build-ios.sh).
      - path: ../core/generated/swift/OceanlnMobileCore.swift
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: OCEAN Lightning
        # Required by Compose Multiplatform for high-refresh-rate iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ocean.mobile
        GENERATE_INFOPLIST_FILE: NO
        # Where embedAndSignAppleFrameworkForXcode drops ComposeApp.framework.
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # The generated Swift glue imports the C FFI through this modulemap.
        SWIFT_INCLUDE_PATHS:
          - "$(SRCROOT)/../core/generated/swift"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
        # The Rust core is linked by explicit archive path, per SDK.
        #
        # NOT `-loceanln_mobile_core`: the crate emits both `staticlib` and
        # `cdylib`, and with the target dir on the search path the linker picks
        # the .dylib. That still "works" on the simulator -- it shares the Mac's
        # filesystem, so the absolute build path resolves -- but the app is then
        # loading the core from the developer's machine, and on a real device it
        # dies at launch with "Library not loaded". Naming the .a removes the
        # ambiguity entirely.
        OTHER_LDFLAGS[sdk=iphonesimulator*]:
          - "$(inherited)"
          - "$(SRCROOT)/../core/target/aarch64-apple-ios-sim/release/liboceanln_mobile_core.a"
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - "$(inherited)"
          - "$(SRCROOT)/../core/target/aarch64-apple-ios/release/liboceanln_mobile_core.a"
        # Let the Gradle run-script write the framework into the build dir.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Simulator builds need no signing. Scoped to the simulator SDK so this
        # does not silently disable signing for device/archive builds too.
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        # Device builds sign automatically. The team comes from the environment
        # so no one's Apple Team ID is committed:
        #   export OCEAN_DEVELOPMENT_TEAM=XXXXXXXXXX   # your 10-char Team ID
        # Unset is fine for simulator builds, which do not sign at all.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${OCEAN_DEVELOPMENT_TEAM}
    preBuildScripts:
      - name: "Compile & embed Kotlin framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
