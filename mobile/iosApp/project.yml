name: iosApp
options:
  bundleIdPrefix: xyz.ocean
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # UniFFI-generated Swift glue for the Rust core (../core/build-ios.sh).
      - path: ../core/generated/swift/OceanlnMobileCore.swift
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: OCEAN Lightning
        # Required by Compose Multiplatform for high-refresh-rate iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ocean.mobile
        GENERATE_INFOPLIST_FILE: NO
        # Where embedAndSignAppleFrameworkForXcode drops ComposeApp.framework.
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # The generated Swift glue imports the C FFI through this modulemap.
        SWIFT_INCLUDE_PATHS:
          - "$(SRCROOT)/../core/generated/swift"
        # Per-SDK, not a fixed order: a flat list would let a device build link
        # the simulator archive (or vice versa) depending on which resolved first.
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(SRCROOT)/../core/target/aarch64-apple-ios-sim/release"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(SRCROOT)/../core/target/aarch64-apple-ios/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          # The Rust core, as a static archive.
          - "-loceanln_mobile_core"
        # Let the Gradle run-script write the framework into the build dir.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Simulator builds need no signing. Scoped to the simulator SDK so this
        # does not silently disable signing for device/archive builds too.
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
    preBuildScripts:
      - name: "Compile & embed Kotlin framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
