[package]
name = "oceanln"
version = "0.3.0"
edition = "2021"
description = "OCEAN Lightning payout CLI — BIP-322 message signing + Lexe sidecar client"
license = "MIT"
repository = "https://github.com/vincenzopalazzo/oceanln-cli"
rust-version = "1.74"

[[bin]]
name = "oceanln"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bip39 = { version = "2.2", features = ["zeroize", "rand"] }
bitcoin = { version = "0.32", features = ["rand-std"] }
bip322 = "0.0.10"
rpassword = "7"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net"] }
tower = "0.5"
http-body-util = "0.1"
hex = "0.4"

[profile.release]
strip = "symbols"
lto = "thin"
