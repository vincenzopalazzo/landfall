[workspace]
resolver = "2"
members = ["oceanln-common", "oceanln-cli", "oceanln-httpd", "oceanln-mcp"]
# The Tauri desktop app and the mobile UniFFI core are each their own workspace
# (own Cargo.lock + heavy native dep tree). Excluded here so `cargo --workspace`
# CI jobs stay fast and unaffected.
exclude = ["src-tauri", "mobile/core"]

# Shared package metadata — every crate inherits these via `field.workspace = true`.
[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/vincenzopalazzo/oceanln-cli"
rust-version = "1.90"

# Single source of truth for third-party versions across the workspace.
[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bip39 = { version = "2.2", features = ["zeroize", "rand"] }
bitcoin = { version = "0.32", features = ["rand-std"] }
bip322 = "0.0.12"
rpassword = "7"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "1"
# In-process Lexe SDK (feature `lexe-sdk`). `unstable` gates signup/provision.
lexe = { version = "0.1", features = ["unstable"] }
# Needed to list incoming OCEAN payouts directly from the user's Lexe node
# (via the `AppNodeRunApi::get_updated_payments` trait). Stays private to the
# `oceanln_common::lexe_wallet` module — callers see the simple `OceanPayout`
# wrapper, not these raw API types.
lexe-api-core = "0.1"
lexe-common = "0.1"
# HTTP server (oceanln-httpd).
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"
async-trait = "0.1"
# MCP server (oceanln-mcp). `transport-streamable-http-server` ships
# `rmcp::transport::streamable_http_server::StreamableHttpService`, which
# impls `tower::Service` and mounts into axum via `Router::route_service`.
rmcp = { version = "1.7", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
# The MCP `#[tool]` macro emits `schemars`-derived JSON schemas for every
# tool's argument struct. Pin alongside rmcp to keep schema generation in
# sync. v1 is the version rmcp 1.7's `schemars` feature pulls in.
schemars = "1"
# Dev/test only.
assert_cmd = "2.0"
predicates = "3.1"
hex = "0.4"

[profile.release]
strip = "symbols"
lto = "thin"
