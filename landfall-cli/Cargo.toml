[package]
name = "landfall-cli"
description = "Landfall CLI for OCEAN Lightning payouts — BIP-322 message signing + Lexe wallet/sidecar client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "landfall"
path = "src/main.rs"

[features]
# Forward the in-process Lexe wallet to the shared core. On by default — the
# full CLI (`init`/`offer`) works out of the box. `--no-default-features`
# builds the thin sidecar-client CLI (`generate`/`payout`).
default = ["lexe-sdk"]
lexe-sdk = ["landfall-common/lexe-sdk"]

[dependencies]
landfall-common = { path = "../landfall-common", default-features = false }
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
