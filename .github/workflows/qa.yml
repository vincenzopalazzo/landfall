name: QA

# The agent QA harness (scripts/qa, docs/QA-SCENARIOS.md): the compiled CLI
# and loopback server driven over real processes and real HTTP, and the web
# wizard driven in a headless Chromium — the whole BIP-322 payout flow with no
# Lexe node. Complements `CI` (unit/integration suites) with the registry
# scenarios a human would otherwise click through.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main and
# tag builds always finish.
concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Documentation-only changes (Markdown, docs/, LICENSE) skip the job
  # below. A skipped job reports success, so it still satisfies a required
  # status check. On a pull request the merge commit is compared with its
  # first parent (the base), i.e. the whole PR; on main, the push range.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: echo "code=$(scripts/ci/code-changed.sh "$BASE" HEAD)" >> "$GITHUB_OUTPUT"

  qa:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landfall-web/package-lock.json

      # The server needs the `qa-mock` feature for `--mock-wallet`; the
      # release build in `CI` never carries it.
      - name: Build CLI + httpd (qa-mock)
        run: cargo build --release -p landfall-cli -p landfall-httpd --features landfall-httpd/qa-mock

      - name: CLI scenarios (QA-001…)
        run: scripts/qa/cli-smoke.sh

      - name: HTTP server scenarios (QA-101…)
        run: scripts/qa/httpd-smoke.sh

      - name: Web wizard — install
        working-directory: landfall-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Web wizard scenarios (QA-201…)
        run: scripts/qa/web-e2e.sh

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            landfall-web/test-results
            .qa/web/*.log
          if-no-files-found: ignore
