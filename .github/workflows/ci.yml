name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Thin build: the CLI + shared core without the in-process Lexe SDK.
      # Scoped to those two crates — `oceanln-httpd` is the in-process server
      # and always requires `lexe-sdk`, so it has no no-default-features mode.
      - name: Clippy (thin build, no Lexe SDK)
        run: cargo clippy --all-targets --no-default-features -p oceanln-common -p oceanln-cli -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Build release
        run: cargo build --release --workspace
