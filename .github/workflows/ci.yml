name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main and
# tag builds always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Documentation-only changes (Markdown, docs/, LICENSE) skip the job
  # below. A skipped job reports success, so it still satisfies a required
  # status check. On a pull request the merge commit is compared with its
  # first parent (the base), i.e. the whole PR; on main, the push range.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: echo "code=$(scripts/ci/code-changed.sh "$BASE" HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Thin build: the CLI + shared core without the in-process Lexe SDK.
      # Scoped to those two crates — `landfall-httpd` is the in-process server
      # and always requires `lexe-sdk`, so it has no no-default-features mode.
      - name: Clippy (thin build, no Lexe SDK)
        run: cargo clippy --all-targets --no-default-features -p landfall-common -p landfall-cli -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      # Run the thin-build test suite too, not just clippy — the sidecar-client
      # path (no in-process Lexe SDK) must keep passing its own tests.
      - name: Test (thin build, no Lexe SDK)
        run: cargo test --no-default-features -p landfall-common -p landfall-cli

      - name: Build release
        run: cargo build --release --workspace
