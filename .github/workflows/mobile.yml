name: Mobile

# The mobile app is ~4k lines of Kotlin/Swift over its own Rust crate, none of
# which the root `CI` workflow touches: `mobile/core` is excluded from the
# workspace (own Cargo.lock + the heavy Lexe SDK tree), and there is no Gradle
# job. Without this file a green CI says nothing about the mobile code.
#
# Path-filtered so a docs- or web-only PR doesn't pay for the Lexe build.
on:
  push:
    paths:
      - "mobile/**"
      - "oceanln-common/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "oceanln-common/**"
      - ".github/workflows/mobile.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The Rust core, in its own workspace. Also emits the Kotlin bindings the
  # Android job needs, so the Lexe SDK tree is built once per run rather than
  # once per job.
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/core

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --lib

      # Library-mode generation: reads the freshly built host cdylib, so the
      # bindings always match the crate under test. No Android NDK needed --
      # that is only required for the .so the app loads at runtime.
      - name: Generate Kotlin bindings
        run: |
          cargo build --lib
          cargo run --quiet --bin uniffi-bindgen -- generate \
            --library target/debug/liboceanln_mobile_core.so \
            --language kotlin --no-format \
            --out-dir ../composeApp/src/androidMain/kotlin

      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: mobile/composeApp/src/androidMain/kotlin/xyz/ocean/mobile/core/
          if-no-files-found: error

  # commonMain + androidMain compile, and the shared unit tests run on the JVM.
  # No emulator: the tests that matter here (the repository cache) are pure
  # Kotlin and need no device.
  android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # androidMain references the generated `xyz.ocean.mobile.core.*`; without
      # these the source set does not resolve.
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-bindings
          path: mobile/composeApp/src/androidMain/kotlin/xyz/ocean/mobile/core/

      - name: Unit tests (commonMain + androidMain)
        working-directory: mobile
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

  # commonMain + iosMain compile, and the shared tests run on Kotlin/Native.
  # Deliberately independent of the Rust build: the ComposeApp framework has no
  # native linkage -- the static lib is linked by the Xcode app, not here -- so
  # this job needs no Rust toolchain and no iOS target.
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (commonMain + iosMain, Kotlin/Native)
        working-directory: mobile
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace
