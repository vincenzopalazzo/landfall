name: web

on:
  push:
    branches: [main]
    paths:
      - "landfall-web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "landfall-web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main and
# tag builds always finish.
concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landfall-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landfall-web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
