name: desktop-linux

# Build the Tauri desktop app's Linux packages (.deb, .rpm, .AppImage).
# Tauri's Linux bundlers link webkit2gtk/GTK and shell out to dpkg-deb /
# rpmbuild / appimagetool, so this MUST run on Linux — it cannot be
# cross-built from macOS. Triggered manually or on a version tag; the
# bundles are uploaded as build artifacts (and attached to a GitHub
# Release when the run is for a tag).

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  # Validate the desktop bundle when desktop-affecting files change. The bundle
  # compiles landfall-common/landfall-httpd and embeds landfall-web/dist, and the
  # root Rust CI never runs `cargo tauri build`, so a change to those shared
  # inputs can break the desktop package even when src-tauri is untouched —
  # include them here. (The build is slow, ~20-min, but desktop breakage
  # slipping through silently is worse.)
  pull_request:
    paths:
      - "src-tauri/**"
      - "landfall-common/**"
      - "landfall-httpd/**"
      - "landfall-web/**"
      - ".github/workflows/desktop-linux.yml"

# The release-attach step on tag builds uploads assets via the GitHub token,
# which needs contents: write; the org/repo default can be read-only. Harmless
# on PR runs (nothing writes there).
permissions:
  contents: write

jobs:
  build:
    # 22.04 keeps the AppImage's glibc floor low so it runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            build-essential \
            rpm \
            curl wget

      - uses: dtolnay/rust-toolchain@stable

      # src-tauri is its own workspace with its own Cargo.lock; cache on it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landfall-web/package-lock.json

      - name: Build the web frontend (the bundle's frontendDist)
        working-directory: landfall-web
        run: |
          npm ci
          npm run build

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The committed beforeBuildCommand (`npm --prefix ../landfall-web run
      # build`) resolves its relative path from the wrong dir in some
      # checkouts, and we already built the frontend above — so disable it
      # and bundle the existing dist/.
      - name: Build Linux bundles (.deb, .rpm, .AppImage)
        working-directory: src-tauri
        run: cargo tauri build --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect bundles
        run: |
          mkdir -p dist-linux
          cp -v src-tauri/target/release/bundle/deb/*.deb           dist-linux/ 2>/dev/null || true
          cp -v src-tauri/target/release/bundle/rpm/*.rpm           dist-linux/ 2>/dev/null || true
          cp -v src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/ 2>/dev/null || true
          ls -la dist-linux

      - uses: actions/upload-artifact@v4
        with:
          name: landfall-desktop-linux
          path: dist-linux/*
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-linux/*
