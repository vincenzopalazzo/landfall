name: docs

on:
  push:
    branches: [main]
    paths:
      - "landfall-docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "landfall-docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Don't run two builds of the same ref at once.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landfall-docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landfall-docs/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
